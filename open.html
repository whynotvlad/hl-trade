<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Trade</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #18181b; color: #fafafa; padding: 16px 16px 120px; font-size: 15px; }
    h1 { font-size: 18px; margin-bottom: 20px; }
    .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #71717a; margin: 16px 0 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.tog {
      padding: 14px; border: 2px solid #27272a; border-radius: 12px;
      background: #27272a; color: #71717a; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button.tog.on-long  { border-color: #16a34a; color: #16a34a; background: rgba(22,163,74,.15); }
    button.tog.on-short { border-color: #dc2626; color: #dc2626; background: rgba(220,38,38,.15); }
    button.tog.on-blue  { border-color: #2563eb; color: #2563eb; background: rgba(37,99,235,.15); }
    input[type=text], input[type=number] {
      width: 100%; padding: 13px 14px; border-radius: 12px;
      border: 2px solid #27272a; background: #27272a; color: #fafafa;
      font-size: 16px; outline: none; -webkit-appearance: none; box-sizing: border-box;
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 10px 16px; border-radius: 999px; border: 2px solid #27272a;
      background: #27272a; color: #71717a; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .chip.on { border-color: #2563eb; color: #2563eb; background: rgba(37,99,235,.15); }
    #summary { background: #27272a; border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #71717a; margin-top: 16px; }
    #go {
      width: 100%; padding: 16px; margin-top: 16px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Open Trade</h1>

<div class="lbl">Side</div>
<div class="row">
  <button class="tog on-long" id="b-long"  onclick="setSide('long')">🟢 Long</button>
  <button class="tog"         id="b-short" onclick="setSide('short')">🔴 Short</button>
</div>

<div class="lbl">Coin</div>
<input type="text" id="coin" placeholder="BTC, ETH, SOL..." list="coins"
       oninput="this.value=this.value.toUpperCase();upd()" />
<datalist id="coins">
  <option value="BTC"/><option value="ETH"/><option value="SOL"/>
  <option value="AVAX"/><option value="ARB"/><option value="DOGE"/>
  <option value="LINK"/><option value="OP"/><option value="APT"/>
</datalist>

<div class="lbl">Size</div>
<input type="number" id="size" placeholder="e.g. 0.001" step="any" min="0" oninput="upd()" />

<div class="lbl">Leverage</div>
<div class="chips">
  <div class="chip"    id="l2"  onclick="setLev(2)">2x</div>
  <div class="chip on" id="l5"  onclick="setLev(5)">5x</div>
  <div class="chip"    id="l10" onclick="setLev(10)">10x</div>
  <div class="chip"    id="l20" onclick="setLev(20)">20x</div>
</div>

<div class="lbl">Order Type</div>
<div class="row">
  <button class="tog on-blue" id="b-mkt" onclick="setType('market')">Market</button>
  <button class="tog"         id="b-lmt" onclick="setType('limit')">Limit</button>
</div>
<div id="lmt-row" style="display:none;margin-top:10px">
  <input type="number" id="lmt-px" placeholder="Limit price $" step="any" min="0" oninput="upd()" />
</div>

<div class="lbl">TP / SL (optional)</div>
<div class="row">
  <input type="number" id="tp" placeholder="Take profit $" step="any" min="0" />
  <input type="number" id="sl" placeholder="Stop loss $"  step="any" min="0" />
</div>

<div id="summary">Fill in coin and size above.</div>

<button id="go" onclick="placeOrder()">Preview Order</button>


<script>
var tg = null;
try { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); } catch(e) {}

var side = 'long';
var lev  = 5;
var otype = 'market';

function setSide(s) {
  side = s;
  document.getElementById('b-long').className  = 'tog' + (s === 'long'  ? ' on-long'  : '');
  document.getElementById('b-short').className = 'tog' + (s === 'short' ? ' on-short' : '');
  upd();
}

function setLev(n) {
  lev = n;
  var ids = ['l2','l5','l10','l20'];
  var vals = [2, 5, 10, 20];
  for (var i = 0; i < ids.length; i++) {
    document.getElementById(ids[i]).className = 'chip' + (vals[i] === n ? ' on' : '');
  }
  upd();
}

function setType(t) {
  otype = t;
  document.getElementById('b-mkt').className = 'tog' + (t === 'market' ? ' on-blue' : '');
  document.getElementById('b-lmt').className = 'tog' + (t === 'limit'  ? ' on-blue' : '');
  document.getElementById('lmt-row').style.display = t === 'limit' ? 'block' : 'none';
  upd();
}

function upd() {
  var coin = document.getElementById('coin').value.trim() || '—';
  var size = document.getElementById('size').value.trim();
  var el   = document.getElementById('summary');
  if (!coin || coin === '—' || !size) { el.textContent = 'Fill in coin and size above.'; return; }
  var dir  = side === 'long' ? '🟢 Long' : '🔴 Short';
  var px   = otype === 'limit' ? (' @ $' + (document.getElementById('lmt-px').value || '?')) : ' @ market';
  el.textContent = dir + ' ' + size + ' ' + coin + px + ' ' + lev + 'x';
}

function placeOrder() {
  try {
    var coin = document.getElementById('coin').value.trim().toUpperCase();
    var size = document.getElementById('size').value.trim();
    var lmtpx = document.getElementById('lmt-px').value.trim();
    var tp   = document.getElementById('tp').value.trim();
    var sl   = document.getElementById('sl').value.trim();

    if (!coin)        { alert('Enter a coin, e.g. BTC'); return; }
    if (!size || parseFloat(size) <= 0) { alert('Enter a size, e.g. 0.001'); return; }
    if (lev < 1 || lev > 50)           { alert('Leverage must be 1-50'); return; }
    if (otype === 'limit' && !lmtpx)   { alert('Enter a limit price'); return; }

    var payload = JSON.stringify({
      coin: coin, side: side, size: size, leverage: String(lev),
      order_type: otype, limit_price: lmtpx, tp: tp, sl: sl
    });

    if (tg && tg.sendData) {
      tg.sendData(payload);
    } else {
      alert('Not in Telegram. Payload: ' + payload);
    }
  } catch(e) {
    alert('Error: ' + e.message);
  }
}
</script>
</body>
</html>
