<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Close Position</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f12;
      color: #f4f4f5;
      padding: 16px 16px 110px;
      font-size: 15px;
      margin: 0;
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 1px solid #27272a;
    }
    .header-icon { font-size: 22px; }
    .header h1 { font-size: 18px; font-weight: 700; margin: 0; }
    .header p  { font-size: 12px; color: #71717a; margin: 2px 0 0; }

    .section { margin-bottom: 20px; }
    .lbl {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: #52525b; margin-bottom: 8px;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    button.tog {
      padding: 13px 10px; border: 1.5px solid #27272a; border-radius: 12px;
      background: #1c1c20; color: #52525b;
      font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
      transition: border-color .15s, color .15s, background .15s;
    }
    button.tog.on-blue   { border-color: #2563eb; color: #60a5fa; background: rgba(37,99,235,.12); }
    button.tog.on-orange { border-color: #ea580c; color: #fb923c; background: rgba(234,88,12,.12); }

    input[type=text], input[type=number] {
      width: 100%; padding: 13px 14px; border-radius: 12px;
      border: 1.5px solid #27272a; background: #1c1c20; color: #f4f4f5;
      font-size: 16px; outline: none; -webkit-appearance: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #3f3f46; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 9px 20px; border-radius: 999px; border: 1.5px solid #27272a;
      background: #1c1c20; color: #52525b;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .chip.on      { border-color: #2563eb; color: #60a5fa; background: rgba(37,99,235,.12); }
    .chip.on-sl   { border-color: #ea580c; color: #fb923c; background: rgba(234,88,12,.12); }

    .type-hint {
      font-size: 12px; color: #52525b; margin-top: 8px;
      padding: 8px 12px; background: #1c1c20; border-radius: 8px;
      line-height: 1.5;
    }

    .preview-card {
      background: #1c1c20; border: 1.5px solid #27272a;
      border-radius: 14px; padding: 14px 16px;
      font-size: 13px; color: #71717a; line-height: 1.7;
      margin-top: 4px;
    }
    .preview-card .preview-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: #52525b; margin-bottom: 10px;
    }
    .level-row { display: flex; justify-content: space-between; }
    .level-num { color: #52525b; }
    .level-pct { color: #f4f4f5; font-weight: 600; }
    .level-px  { color: #f4f4f5; font-weight: 600; }

    .warn-row {
      font-size: 12px; color: #f97316; margin-top: 8px;
      display: flex; align-items: center; gap: 6px;
    }

    .divider { height: 1px; background: #27272a; margin: 20px 0; }

    #go {
      width: 100%; padding: 16px; margin-top: 4px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 14px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      transition: opacity .15s, background .15s;
    }
    #go:active { opacity: .85; }
    #go.sl { background: #ea580c; }
  </style>
</head>
<body>

<div class="header">
  <span class="header-icon">📊</span>
  <div>
    <h1>Close Position</h1>
    <p>Split your exit into multiple orders</p>
  </div>
</div>

<div class="section">
  <div class="lbl">Type</div>
  <div class="row2">
    <button class="tog on-blue"   id="b-ladder"   onclick="setType('ladder')">📊 Ladder</button>
    <button class="tog"           id="b-slladder" onclick="setType('slladder')">🛑 SL Ladder</button>
  </div>
  <div class="type-hint" id="type-hint">
    Limit orders — fills as price moves through each level (take-profit style).
  </div>
</div>

<div class="section">
  <div class="lbl">Coin</div>
  <input type="text" id="coin" placeholder="BTC, ETH, SOL …" list="coins"
         oninput="this.value=this.value.toUpperCase();upd()" autocomplete="off" />
  <datalist id="coins">
    <option value="BTC"/><option value="ETH"/><option value="SOL"/>
    <option value="AVAX"/><option value="ARB"/><option value="DOGE"/>
    <option value="LINK"/><option value="OP"/><option value="APT"/>
  </datalist>
</div>

<div class="section">
  <div class="lbl">Parts</div>
  <div class="chips">
    <div class="chip"    id="p2"  onclick="setParts(2)">2</div>
    <div class="chip on" id="p3"  onclick="setParts(3)">3</div>
    <div class="chip"    id="p5"  onclick="setParts(5)">5</div>
    <div class="chip"    id="p10" onclick="setParts(10)">10</div>
  </div>
</div>

<div class="section">
  <div class="lbl">Price Range</div>
  <div class="row2">
    <input type="number" id="from-price" placeholder="From $" step="any" min="0" oninput="upd()" />
    <input type="number" id="to-price"   placeholder="To $"   step="any" min="0" oninput="upd()" />
  </div>
</div>

<div class="divider"></div>

<div class="preview-card">
  <div class="preview-title">Preview</div>
  <div id="summary">Fill in coin and price range to see levels.</div>
</div>

<button id="go" onclick="previewOrder()">Preview Order</button>

<script>
var tg = null;
try { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); if (tg.MainButton) tg.MainButton.hide(); } catch(e) {}

var orderType = 'ladder';
var parts     = 3;

var TYPE_HINTS = {
  ladder:   'Limit orders — fills as price moves through each level (take-profit style).',
  slladder: 'Stop triggers — market close when price crosses each level (stop-loss style).'
};

function setType(t) {
  orderType = t;
  document.getElementById('b-ladder').className   = 'tog' + (t === 'ladder'   ? ' on-blue'   : '');
  document.getElementById('b-slladder').className = 'tog' + (t === 'slladder' ? ' on-orange' : '');
  document.getElementById('type-hint').textContent = TYPE_HINTS[t];
  document.getElementById('go').className = t === 'slladder' ? 'sl' : '';
  updateChipStyle();
  upd();
}

function setParts(n) {
  parts = n;
  updateChipStyle();
  upd();
}

function updateChipStyle() {
  var ids  = ['p2','p3','p5','p10'];
  var vals = [2, 3, 5, 10];
  var cls  = orderType === 'slladder' ? ' on-sl' : ' on';
  for (var i = 0; i < ids.length; i++) {
    document.getElementById(ids[i]).className = 'chip' + (vals[i] === parts ? cls : '');
  }
}

function roundPrice(px) {
  if (px <= 0) return px;
  var mag    = Math.floor(Math.log10(Math.abs(px)));
  var factor = Math.pow(10, 4 - mag);
  return Math.round(px * factor) / factor;
}

function fmtPrice(px) {
  if (px >= 1000) return '$' + px.toLocaleString('en-US', {maximumFractionDigits: 0});
  if (px >= 1)    return '$' + px.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return '$' + px.toFixed(4);
}

function upd() {
  var coin = document.getElementById('coin').value.trim();
  var fp   = parseFloat(document.getElementById('from-price').value);
  var tp   = parseFloat(document.getElementById('to-price').value);
  var el   = document.getElementById('summary');

  if (!coin || isNaN(fp) || isNaN(tp)) {
    el.innerHTML = 'Fill in coin and price range to see levels.';
    return;
  }

  var typeLabel = orderType === 'ladder' ? '📊 Limit ladder' : '🛑 SL trigger ladder';
  var pct = (100 / parts).toFixed(1);
  var html = '<div style="color:#f4f4f5;font-weight:600;margin-bottom:8px">' + typeLabel + ' &mdash; ' + parts + ' orders for ' + coin + '</div>';

  for (var i = 0; i < parts; i++) {
    var px = parts > 1 ? fp + (tp - fp) * i / (parts - 1) : fp;
    px = roundPrice(px);
    html += '<div class="level-row">';
    html += '<span class="level-num">' + (i+1) + '.</span>';
    html += '<span class="level-pct">' + pct + '%</span>';
    html += '<span class="level-px">' + fmtPrice(px) + '</span>';
    html += '</div>';
  }

  if (fp === tp) {
    html += '<div class="warn-row">⚠️ From and To prices must be different.</div>';
  }

  el.innerHTML = html;
}

function previewOrder() {
  try {
    var coin = document.getElementById('coin').value.trim().toUpperCase();
    var fp   = document.getElementById('from-price').value.trim();
    var tp   = document.getElementById('to-price').value.trim();

    if (!coin)                                             { showAlert('Enter a coin, e.g. BTC'); return; }
    if (!fp || parseFloat(fp) <= 0)                        { showAlert('Enter a valid From price'); return; }
    if (!tp || parseFloat(tp) <= 0)                        { showAlert('Enter a valid To price'); return; }
    if (parseFloat(fp) === parseFloat(tp))                 { showAlert('From and To prices must be different'); return; }
    if (parts < 2 || parts > 20)                           { showAlert('Parts must be between 2 and 20'); return; }

    var payload = JSON.stringify({
      form_type:   'ladder',
      ladder_type: orderType,
      coin:        coin,
      parts:       String(parts),
      from_price:  fp,
      to_price:    tp
    });

    if (tg && tg.sendData) {
      tg.sendData(payload);
    } else {
      alert('Not in Telegram.\nPayload:\n' + payload);
    }
  } catch(e) {
    showAlert('Error: ' + e.message);
  }
}

function showAlert(msg) {
  try { tg.showAlert(msg); } catch(_) { alert(msg); }
}
</script>
</body>
</html>
